<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRICKET SHORT PRO V4.4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:white;font-family:Arial,sans-serif}
header{background:#102c4c;padding:18px;text-align:center}
header h2{margin:0;color:#35e6a0}
header p{margin:6px 0 0;color:#c5d7e8;font-size:13px}
.container{max-width:850px;margin:auto;padding:12px}
.card{background:#10233a;border:1px solid #254361;border-radius:13px;padding:14px;margin-bottom:13px}
h3{margin:0 0 12px;color:#35e6a0}
input,select{width:100%;padding:12px;margin:5px 0 10px;border-radius:8px;border:1px solid #45617c;background:#071426;color:white;font-size:16px}
button{border:0;border-radius:9px;padding:12px;margin:4px;background:#1768a8;color:white;font-weight:bold;font-size:15px}
.run{width:29%;background:#087c59;font-size:19px}
.extra{background:#7651a8}
.danger{background:#bd3448}
.secondary{background:#52677d}
.score{text-align:center;font-size:42px;font-weight:bold;color:#35e6a0}
.sub{text-align:center;color:#d0dceb;margin:5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 5px;border-bottom:1px solid #34506a;text-align:center}
th{color:#35e6a0}
.status{color:#ffd166;font-weight:bold}
.result{background:#164a38;padding:14px;border-radius:10px;text-align:center;font-size:18px;font-weight:bold}
.small{font-size:12px;color:#b8c9d9}
</style>
</head>
<body>
<header>
<h2>🏏 CRICKET SHORT PRO V4.4</h2>
<p>Complete Manual Cricket Scoring System</p>
</header>

<div class="container">
<div class="card" id="setup">
<h3>🏏 नया मैच शुरू करें</h3>
<label>पहली टीम</label>
<input id="teamA" value="India">
<label>दूसरी टीम</label>
<input id="teamB" value="Pakistan">
<label>मैच फॉर्मेट</label>
<select id="format">
<option value="20">T20 - 20 Overs</option>
<option value="50">ODI - 50 Overs</option>
</select>
<button onclick="startMatch()">Start Match ▶</button>
</div>

<div id="app" style="display:none">
<div class="card">
<h3 id="matchTitle"></h3>
<div class="sub" id="inningsTitle"></div>
<div class="score" id="score"></div>
<div class="sub" id="overs"></div>
<div class="sub" id="target"></div>
<div class="sub" id="runrate"></div>
<div id="result"></div>
</div>

<div class="card">
<h3>🏏 बल्लेबाज</h3>
<div id="batters"></div>
<button class="secondary" onclick="changeStrike()">🔄 Change Strike</button>
</div>

<div class="card">
<h3>🎯 गेंदबाज</h3>
<div id="bowler"></div>
<button onclick="changeBowler()">Change Bowler</button>
</div>

<div class="card">
<h3>➕ रन जोड़ें</h3>
<div class="grid">
<button class="run" onclick="addRuns(0)">0</button>
<button class="run" onclick="addRuns(1)">1</button>
<button class="run" onclick="addRuns(2)">2</button>
<button class="run" onclick="addRuns(3)">3</button>
<button class="run" onclick="addRuns(4)">4</button>
<button class="run" onclick="addRuns(6)">6</button>
</div>
<h3 style="margin-top:15px">Extras</h3>
<button class="extra" onclick="addExtra('Wide')">Wide +1</button>
<button class="extra" onclick="addExtra('No Ball')">No Ball +1</button>
<button class="extra" onclick="addExtra('Bye')">Bye +1</button>
<button class="extra" onclick="addExtra('Leg Bye')">Leg Bye +1</button>
</div>

<div class="card">
<h3>⚡ अन्य विकल्प</h3>
<button class="danger" onclick="wicket()">WICKET / आउट का प्रकार</button>
<button class="secondary" onclick="undo()">↩ Undo</button>
<button class="secondary" onclick="endInnings()">End Innings / Next Innings</button>
<button class="danger" onclick="finishManually()">🏆 Finish Match</button>
</div>

<div class="card">
<h3>📊 Complete Scorecards</h3>
<div id="scorecards"></div>
</div>

<div class="card">
<h3>⚾ Ball-by-Ball Commentary</h3>
<div id="commentary" class="small"></div>
</div>

<div class="card">
<h3>💾 Save Status</h3>
<div id="saveStatus">स्कोर सेव होगा।</div>
<button class="secondary" onclick="restoreMatch()">Restore Saved Match</button>
<button class="danger" onclick="newMatch()">नया मैच / Reset</button>
</div>
</div>
</div>

<script>
const KEY="cricketShortProV44";
let state=null,history=[];

function askName(label,def){
 let v=prompt(label,def||"");
 return v&&v.trim()?v.trim():(def||"Player");
}

function makeInnings(bat,bowl,target=null){
 let p1=askName(bat+" का पहला बल्लेबाज","Batter 1");
 let p2=askName(bat+" का दूसरा बल्लेबाज","Batter 2");
 let bw=askName(bowl+" का शुरुआती गेंदबाज","Bowler 1");
 return {
  batting:bat,bowling:bowl,target,
  runs:0,wickets:0,legal:0,extras:0,completed:false,
  batters:[
   {name:p1,r:0,b:0,f:0,s:0,out:false},
   {name:p2,r:0,b:0,f:0,s:0,out:false}
  ],
  striker:0,non:1,
  bowlers:[{name:bw,r:0,w:0,legal:0}],
  currentBowler:0,log:[]
 };
}

function startMatch(){
 let a=document.getElementById("teamA").value.trim()||"India";
 let b=document.getElementById("teamB").value.trim()||"Pakistan";
 if(a===b){alert("दोनों टीमों के नाम अलग रखें।");return}
 state={a,b,max:Number(document.getElementById("format").value),
 innings:[],idx:0,finished:false,result:""};
 state.innings.push(makeInnings(a,b));
 history=[];
 document.getElementById("setup").style.display="none";
 document.getElementById("app").style.display="block";
 save();render();
}

function cur(){return state.innings[state.idx]}
function overs(b){return Math.floor(b.legal/6)+"."+(b.legal%6)}
function isOver(i){
 return i.wickets>=10 || i.legal>=state.max*6 ||
 (i.target!==null && i.runs>=i.target);
}
function snapshot(){
 history.push(JSON.stringify(state));
 if(history.length>50)history.shift();
}
function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
  document.getElementById("saveStatus").textContent="✅ स्कोर मोबाइल में सेव है।";
 }catch(e){}
}
function record(t){
 cur().log.unshift(t);
 if(cur().log.length>150)cur().log.length=150;
}
function swap(){
 let i=cur(),t=i.striker;
 i.striker=i.non;i.non=t;
}
function ballComplete(){
 let i=cur(),bw=i.bowlers[i.currentBowler];
 i.legal++;bw.legal++;
 if(i.legal%6===0){
  record("ओवर समाप्त: "+overs(i));
  swap();
  let name=askName("नया ओवर शुरू। गेंदबाज का नाम","Bowler "+(i.bowlers.length+1));
  i.bowlers.push({name,r:0,w:0,legal:0});
  i.currentBowler=i.bowlers.length-1;
 }
}
function finishIfNeeded(){
 let i=cur();
 if(isOver(i)){
  i.completed=true;
  if(state.idx===1){
   state.finished=true;
   calculateResult();
  }
 }
}
function addRuns(n){
 let i=cur();
 if(state.finished||i.completed||isOver(i)){
  alert("यह पारी समाप्त हो चुकी है।");return;
 }
 snapshot();
 let bat=i.batters[i.striker],bw=i.bowlers[i.currentBowler];
 bat.r+=n;bat.b++;
 if(n===4)bat.f++;
 if(n===6)bat.s++;
 i.runs+=n;bw.r+=n;
 record(n+" रन — "+bat.name);
 if(n%2===1)swap();
 ballComplete();
 finishIfNeeded();
 save();render();
}
function addExtra(type){
 let i=cur();
 if(state.finished||i.completed||isOver(i)){
  alert("यह पारी समाप्त हो चुकी है।");return;
 }
 snapshot();
 let bw=i.bowlers[i.currentBowler];
 let bat=i.batters[i.striker];
 i.runs++;i.extras++;

 if(type==="Wide"){
  bw.r++;
  record("Wide +1");
 }else if(type==="No Ball"){
  bw.r++;
  bat.b++;
  record("No Ball +1");
 }else if(type==="Bye"){
  bat.b++;
  record("Bye +1");
  ballComplete();
 }else if(type==="Leg Bye"){
  bat.b++;
  record("Leg Bye +1");
  ballComplete();
 }
 finishIfNeeded();
 save();render();
}

function wicket(){
 let i=cur();
 if(state.finished||i.completed||isOver(i)){
  alert("यह पारी समाप्त हो चुकी है।");return;
 }
 let types=[
  "Bowled","Caught","Run Out","LBW","Stumped",
  "Hit Wicket","Retired Hurt","Retired Out"
 ];
 let choice=prompt(
  "आउट का प्रकार नंबर लिखें:\n"+
  "1. Bowled\n2. Caught\n3. Run Out\n4. LBW\n"+
  "5. Stumped\n6. Hit Wicket\n7. Retired Hurt\n8. Retired Out",
  "1"
 );
 if(choice===null)return;
 let n=Number(choice);
 if(n<1||n>8||!Number.isInteger(n)){
  alert("सही नंबर चुनें।");return;
 }
 let type=types[n-1];

 snapshot();
 let bat=i.batters[i.striker];
 let bw=i.bowlers[i.currentBowler];

 if(type==="Retired Hurt"){
  bat.out=false;
  record(bat.name+" Retired Hurt");
  if(!isOver(i)){
   let name=askName("नया बल्लेबाज","Replacement Batter");
   i.batters.push({name,r:0,b:0,f:0,s:0,out:false});
   i.striker=i.batters.length-1;
  }
 }else{
  bat.out=true;
  if(type!=="Retired Out")bat.b++;
  i.wickets++;

  if(["Bowled","Caught","LBW","Stumped","Hit Wicket"].includes(type)){
   bw.w++;
  }
  record("WICKET! "+bat.name+" — "+type);

  if(i.wickets<10){
   ballComplete();
   if(!isOver(i)){
    let name=askName("नए बल्लेबाज का नाम","New Batter");
    i.batters.push({name,r:0,b:0,f:0,s:0,out:false});
    i.striker=i.batters.length-1;
   }
  }
 }
 finishIfNeeded();
 save();render();
}

function changeStrike(){
 if(state.finished||cur().completed)return;
 snapshot();swap();record("बल्लेबाजों ने छोर बदला");
 save();render();
}
function changeBowler(){
 let i=cur();
 if(state.finished||i.completed)return;
 snapshot();
 let name=askName("नए गेंदबाज का नाम","New Bowler");
 i.bowlers.push({name,r:0,w:0,legal:0});
 i.currentBowler=i.bowlers.length-1;
 record("गेंदबाज बदला: "+name);
 save();render();
}
function endInnings(){
 let i=cur();
 if(state.finished)return;
 if(state.idx===0){
  if(!confirm("पहली पारी समाप्त करके दूसरी पारी शुरू करें?"))return;
  snapshot();i.completed=true;
  let next=makeInnings(i.bowling,i.batting,i.runs+1);
  state.innings.push(next);state.idx=1;
  state.finished=false;state.result="";
  save();render();
 }else{
  snapshot();i.completed=true;
  state.finished=true;calculateResult();
  save();render();
 }
}
function calculateResult(){
 let a=state.innings[0],b=state.innings[1];
 if(!b)return;
 if(b.runs>=b.target){
  state.result=b.batting+" ने "+(10-b.wickets)+" विकेट से मैच जीता।";
 }else if(a.runs>b.runs){
  state.result=a.batting+" ने "+(a.runs-b.runs)+" रन से मैच जीता।";
 }else if(a.runs===b.runs){
  state.result="मैच टाई हुआ।";
 }else{
  state.result="मैच का परिणाम बराबर नहीं है।";
 }
}
function finishManually(){
 if(!confirm("क्या आप मैच को अभी मैन्युअली समाप्त करना चाहते हैं?"))return;
 snapshot();state.finished=true;
 state.result="मैच मैन्युअली समाप्त किया गया।";
 cur().completed=true;save();render();
}
function undo(){
 if(!history.length){alert("Undo के लिए कोई पिछला स्कोर नहीं है।");return}
 state=JSON.parse(history.pop());save();render();
}
function newMatch(){
 if(!confirm("क्या आप पुराना मैच हटाकर नया मैच शुरू करना चाहते हैं?"))return;
 localStorage.removeItem(KEY);state=null;history=[];location.reload();
}
function restoreMatch(){
 let raw=localStorage.getItem(KEY);
 if(!raw){alert("कोई सेव किया हुआ V4.4 मैच नहीं मिला।");return}
 try{
  state=JSON.parse(raw);
  document.getElementById("setup").style.display="none";
  document.getElementById("app").style.display="block";
  history=[];render();
 }catch(e){alert("Saved match खुल नहीं पाया।")}
}
function safe(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function render(){
 if(!state)return;
 let i=cur();
 document.getElementById("matchTitle").textContent=state.a+" vs "+state.b;
 document.getElementById("inningsTitle").textContent=
 "पारी "+(state.idx+1)+" • "+(state.max===20?"T20":"ODI")+" • "+i.batting+" की बल्लेबाजी";
 document.getElementById("score").textContent=i.runs+"/"+i.wickets;
 document.getElementById("overs").textContent="Overs: "+overs(i);
 document.getElementById("target").textContent=i.target===null?"पहली पारी":
 "Target: "+i.target+" | जरूरत: "+Math.max(0,i.target-i.runs)+" रन";
 document.getElementById("runrate").textContent=
 "Run Rate: "+(i.legal?(i.runs/(i.legal/6)).toFixed(2):"0.00");
 document.getElementById("result").innerHTML=
 state.finished?'<div class="result">🏆 '+safe(state.result)+'</div>':
 i.completed?'<div class="status">पारी समाप्त — अगली पारी शुरू करें।</div>':
 '<div class="status">🔴 LIVE SCORING</div>';

 let rows="<table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>Status</th></tr>";
 i.batters.forEach((b,n)=>{
  rows+="<tr><td>"+safe(b.name)+(n===i.striker?" ⭐":"")+
  "</td><td>"+b.r+"</td><td>"+b.b+"</td><td>"+b.f+"</td><td>"+b.s+
  "</td><td>"+(b.out?"Out":"Not Out")+"</td></tr>";
 });
 rows+="</table>";
 document.getElementById("batters").innerHTML=rows;

 let bw=i.bowlers[i.currentBowler];
 document.getElementById("bowler").innerHTML=
 "<b>"+safe(bw.name)+" ⭐</b><br>Overs: "+overs(bw)+
 " | Runs: "+bw.r+" | Wickets: "+bw.w;

 let cards="";
 state.innings.forEach((inn,n)=>{
  cards+="<div class='card'><b>पारी "+(n+1)+" - "+safe(inn.batting)+
  "</b><h2>"+inn.runs+"/"+inn.wickets+"</h2>";
  cards+="Overs: "+overs(inn)+" | Extras: "+inn.extras;
  cards+="<table><tr><th>Batter</th><th>Runs</th><th>Balls</th><th>4s</th><th>6s</th></tr>";
  inn.batters.forEach(b=>{
   cards+="<tr><td>"+safe(b.name)+"</td><td>"+b.r+"</td><td>"+b.b+
   "</td><td>"+b.f+"</td><td>"+b.s+"</td></tr>";
  });
  cards+="</table><br><b>गेंदबाज</b>";
  cards+="<table><tr><th>Name</th><th>Overs</th><th>Runs</th><th>Wkts</th></tr>";
  inn.bowlers.forEach(b=>{
   cards+="<tr><td>"+safe(b.name)+"</td><td>"+overs(b)+
   "</td><td>"+b.r+"</td><td>"+b.w+"</td></tr>";
  });
  cards+="</table></div>";
 });
 document.getElementById("scorecards").innerHTML=cards;
 document.getElementById("commentary").innerHTML=
 i.log.length?i.log.map(x=>"<div>"+safe(x)+"</div>").join(""):"अभी कोई गेंद नहीं हुई है।";
}

window.addEventListener("load",()=>{
 let raw=localStorage.getItem(KEY);
 if(raw){
  try{
   state=JSON.parse(raw);
   document.getElementById("setup").style.display="none";
   document.getElementById("app").style.display="block";
   render();
  }catch(e){}
 }
});
</script>
</body>
 </html>
